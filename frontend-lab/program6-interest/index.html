<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interest Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="box">
        <h1>Simple Interest Calculator</h1>

        <label>Principal (Rs.)</label>
        <input type="number" id="principal" placeholder="e.g. 10000">

        <label>Rate (% per year)</label>
        <input type="number" id="rate" placeholder="e.g. 5">

        <label>Time (years)</label>
        <input type="number" id="time" placeholder="e.g. 2">

        <button id="calcBtn">Calculate</button>

        <p id="result"></p>
    </div>

    <!-- type="module" is needed to use import/export -->
    <script type="module" src="main.js"></script>
</body>
</html>
